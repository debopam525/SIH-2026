name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Seed demo scan
        run: python -m app.seed
      - name: Tests + coverage (detection / scoring / recommendation focus)
        run: pytest --cov=app --cov-report=term-missing
      - name: Acceptance checks (spec Section 10)
        run: python -m app.acceptance

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: node node_modules/esbuild/install.js || true
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t ecdat/api:${{ github.ref_name }} backend
      - name: Build web image
        run: docker build -t ecdat/web:${{ github.ref_name }} frontend
      - name: Trivy scan (API image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ecdat/api:${{ github.ref_name }}
          exit-code: "0"
          severity: HIGH,CRITICAL
