[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat-backend"
version = "0.1.0"
description = "Enterprise Cryptographic Discovery & Analysis Tool - backend"
requires-python = ">=3.11"
# No native-build dependencies: works on win-arm64 / minimal images without a C/Rust toolchain.
# Auth uses PyJWT (HS256, stdlib hmac) + stdlib scrypt password hashing instead of
# python-jose/cryptography/bcrypt. Server uses plain uvicorn (h11) instead of uvicorn[standard].
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["weasyprint>=62"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI Depends() in defaults is idiomatic. E501: data tables / long log lines;
# correctness rules (F, B) still enforced.
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
