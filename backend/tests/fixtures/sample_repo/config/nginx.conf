server {
    listen 443 ssl;
    server_name example.internal;

    ssl_certificate     /etc/ssl/example.crt;
    ssl_certificate_key /etc/ssl/example.key;

    # Legacy protocol versions still enabled - insecure
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # Cipher list contains weak primitives
    ssl_ciphers 'ECDHE-RSA-AES128-SHA:DES-CBC3-SHA:RC4-MD5:AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
}
